version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: kyra-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=kyra_db
    networks:
      - kyra-network
      - prototyp-orbit-llm_web

  # Backend API (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kyra-backend
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - MONGO_URL=mongodb://mongodb:27017
      - DB_NAME=kyra_db
      - CORS_ORIGINS=*
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      - mongodb
    networks:
      - kyra-network
      - prototyp-orbit-llm_web

  # Frontend (React + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_BACKEND_URL=http://localhost:8001
    container_name: kyra-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - kyra-network

volumes:
  mongodb_data:

networks:
  # Internal network for this stack
  kyra-network:
    driver: bridge
  
  # External network where Ollama is running
  prototyp-orbit-llm_web:
    external: true
